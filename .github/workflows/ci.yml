name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar paquetes NuGet
        run: dotnet restore SoplaElCartucho.sln

      - name: Compilar solución
        run: dotnet build SoplaElCartucho.sln --configuration Release --no-restore

      - name: Ejecutar tests
        run: dotnet test SoplaElCartucho.sln --configuration Release --no-build --verbosity normal
