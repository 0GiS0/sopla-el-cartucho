name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restaurar paquetes NuGet
        run: nuget restore SoplaElCartucho.sln

      - name: Compilar solución
        run: msbuild SoplaElCartucho.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Ejecutar tests
        shell: pwsh
        run: |
          $vsTest = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * `
            -find "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe"
          & $vsTest "SoplaElCartucho.Tests\bin\Release\SoplaElCartucho.Tests.dll" `
            /TestAdapterPath:"packages\MSTest.TestAdapter.3.1.1\build\_common"
