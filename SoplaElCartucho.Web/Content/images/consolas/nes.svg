<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#1a1a1a"/>
  <!-- Console body -->
  <rect x="20" y="60" width="160" height="100" rx="8" ry="8" fill="#8a8a8a"/>
  <rect x="20" y="60" width="160" height="30" rx="4" ry="4" fill="#6a6a6a"/>
  <!-- Cartridge slot -->
  <rect x="55" y="55" width="90" height="10" rx="2" ry="2" fill="#333"/>
  <!-- Power LED -->
  <circle cx="160" cy="75" r="5" fill="#ff4444"/>
  <!-- Controller ports -->
  <rect x="30" y="130" width="30" height="15" rx="3" ry="3" fill="#333"/>
  <rect x="70" y="130" width="30" height="15" rx="3" ry="3" fill="#333"/>
  <!-- Buttons -->
  <rect x="130" y="120" width="15" height="8" rx="2" ry="2" fill="#555"/>
  <rect x="150" y="120" width="15" height="8" rx="2" ry="2" fill="#555"/>
  <!-- Label -->
  <text x="100" y="175" font-family="monospace" font-size="14" font-weight="bold" fill="#ff4444" text-anchor="middle">NES</text>
</svg>