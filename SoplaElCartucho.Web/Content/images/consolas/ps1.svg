<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#1a1a1a"/>
  <!-- Console body -->
  <rect x="15" y="60" width="170" height="95" rx="8" ry="8" fill="#b0b0b0"/>
  <rect x="15" y="60" width="170" height="25" rx="5" ry="5" fill="#9a9a9a"/>
  <!-- CD lid -->
  <rect x="25" y="68" width="100" height="40" rx="3" ry="3" fill="#888"/>
  <circle cx="75" cy="88" r="15" fill="#aaa" stroke="#777" stroke-width="1"/>
  <circle cx="75" cy="88" r="5" fill="#777"/>
  <!-- Buttons -->
  <circle cx="158" cy="80" r="5" fill="#22aa44"/>  <!-- triangle -->
  <circle cx="168" cy="90" r="5" fill="#cc4444"/>  <!-- circle -->
  <circle cx="148" cy="90" r="5" fill="#2244cc"/>  <!-- cross -->
  <circle cx="158" cy="100" r="5" fill="#cc8800"/> <!-- square -->
  <!-- Power button -->
  <circle cx="35" cy="78" r="5" fill="#444"/>
  <!-- Power LED -->
  <circle cx="48" cy="78" r="3" fill="#44ff44"/>
  <!-- Label -->
  <text x="100" y="175" font-family="monospace" font-size="11" font-weight="bold" fill="#cccccc" text-anchor="middle">PLAYSTATION</text>
</svg>