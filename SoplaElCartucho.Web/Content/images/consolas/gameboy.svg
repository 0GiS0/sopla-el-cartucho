<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#1a1a1a"/>
  <!-- Console body -->
  <rect x="55" y="10" width="90" height="155" rx="10" ry="10" fill="#9a9a7a"/>
  <!-- Screen area -->
  <rect x="65" y="20" width="70" height="60" rx="3" ry="3" fill="#666655"/>
  <!-- Screen -->
  <rect x="70" y="25" width="60" height="50" rx="2" ry="2" fill="#8bac0f"/>
  <!-- Screen reflection -->
  <rect x="72" y="27" width="20" height="10" rx="1" ry="1" fill="#9bbc1f" opacity="0.4"/>
  <!-- D-pad -->
  <rect x="68" y="100" width="30" height="10" rx="2" ry="2" fill="#555"/>
  <rect x="78" y="90" width="10" height="30" rx="2" ry="2" fill="#555"/>
  <!-- A B buttons -->
  <circle cx="138" cy="108" r="8" fill="#cc0000"/>
  <circle cx="122" cy="118" r="8" fill="#cc0000"/>
  <text x="138" y="112" font-family="monospace" font-size="8" fill="white" text-anchor="middle">A</text>
  <text x="122" y="122" font-family="monospace" font-size="8" fill="white" text-anchor="middle">B</text>
  <!-- Start/Select -->
  <rect x="85" y="138" width="12" height="5" rx="2" ry="2" fill="#777"/>
  <rect x="103" y="138" width="12" height="5" rx="2" ry="2" fill="#777"/>
  <!-- Label -->
  <text x="100" y="185" font-family="monospace" font-size="10" font-weight="bold" fill="#554433" text-anchor="middle">GAME BOY</text>
</svg>